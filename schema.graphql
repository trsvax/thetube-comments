"""
Comment system for theTube platform.
Spec only — no implementation. AI generates the implementation
by combining this schema with the target platform's spec.

Write endpoint: POST /w/comment/{verb}?{data}
- No body → 202, logged, batch processed
- With body → Lambda processes immediately
"""

type Comment {
  id: ID!
  post: String!
  body: String!
  author: String
  date: String!
}

type Query {
  """Fetch all comments for a post. Returns a file at /comments/{post}.txt"""
  comments(post: String!): [Comment!]!
}

type Mutation {
  """
  Submit a comment.
  URL: POST /w/comment/add?post={post}&body={body}&author={author}
  No body → batch (moderated, appears after processing)
  With body → realtime (appears immediately, requires auth)
  """
  addComment(post: String!, body: String!, author: String): Comment @moderate @realtime @auth(role: "user")
}

"""Batch path: no request body. Logged by CloudFront, processed later."""
directive @moderate on FIELD_DEFINITION

"""Fast path: request body present. Lambda processes immediately."""
directive @realtime on FIELD_DEFINITION

"""Require authentication for the fast path. JWT must carry the specified role."""
directive @auth(role: String!) on FIELD_DEFINITION
