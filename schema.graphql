"""
Comment system for theTube platform.

Write endpoint: POST /w/comment/{verb}?{params}
All comments use the ? path (batch). Data in the URL. 202 always.
The processor is the only writer to /comments/.
Logs are the source of truth. /comments/ is a projection.

Filenames are CloudFront request IDs (server-generated, unique).
No sequential numbering. No coordination. Scales horizontally.
"""

type Comment {
  "CloudFront request ID — the filename"
  requestId: String!
  "The comment space (pageUuid from post frontmatter)"
  page: String!
  body: String!
  author: String
  date: String!
  "True if soft-deleted"
  deleted: Boolean
}

type Query {
  """
  Fetch comments for a post.
  Client fetches /comments/{pageUuid}/index.json — one request, all comments.
  Behind that URL: static file (MVP) or Lambda merge (future).
  """
  comments(page: String!): [Comment!]!
}

type Mutation {
  """
  Submit a comment.
  URL: POST /w/comment/add?page={pageUuid}&body={body}&author={author}&token={token}&id={idempotencyKey}

  Always uses ? path. Always 202. Always batch processed.
  Trust level determined by token type:
  - Build-time token (low trust) → moderated
  - open token (high trust) → written immediately

  Filename assigned by server (CloudFront request ID).
  """
  addComment(
    page: String!
    body: String!
    author: String
    token: String!
    id: String!
  ): Comment @moderate @rateLimit(requests: 5, perSeconds: 60)

  """
  Edit a comment (future, not in MVP).
  URL: POST /w/comment/edit?page={pageUuid}&requestId={id}&body={newBody}&token={token}
  """
  editComment(
    page: String!
    requestId: String!
    body: String!
    token: String!
  ): Comment @auth(role: "user")

  """
  Delete a comment (future, not in MVP).
  Writes {"deleted": true}. Log has full history.
  URL: POST /w/comment/delete?page={pageUuid}&requestId={id}&token={token}
  """
  deleteComment(
    page: String!
    requestId: String!
    token: String!
  ): Comment @auth(role: "user")
}

"""
Open a comment session (future, not in MVP).
Returns a scoped, signed, high-trust token.
Fallback: build-time token already in the page.
URL: GET /w/comment/open?page={pageUuid}
"""
type OpenResponse {
  token: String!
  id: String!
  trust: String!
}

"""Batch path: ? present. Logged by CloudFront, processed by Lambda."""
directive @moderate on FIELD_DEFINITION

"""Require authentication. High-trust token or JWT with specified role."""
directive @auth(role: String!) on FIELD_DEFINITION

"""
Rate limit declaration. Platform enforces via WAF.
Declared by the namespace repo, applied by the platform.
"""
directive @rateLimit(requests: Int!, perSeconds: Int!) on FIELD_DEFINITION
